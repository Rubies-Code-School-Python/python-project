<style>
:root{--p:#592D82;--pd:#421F63;--pl:#EFE6F5;--o:#E87C15;--t:#2B2038;--g:#6B6376;--ok:#1E7A34;--bad:#B3261E}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,Segoe UI,Arial,sans-serif;color:var(--t);background:#fff;line-height:1.5}
header{background:var(--p);color:#fff;padding:16px 20px;border-bottom:6px solid var(--o)}.wrap{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.top img{height:44px;border-radius:4px}h1{font-size:1.3rem;margin:0}.sub{margin:0;font-size:.85rem;color:#E8D9F2}
.tm{margin-left:auto;font-weight:600;background:var(--pd);padding:4px 12px;border-radius:14px;font-size:.9rem}
main{padding:20px 20px 48px}h2{color:var(--pd);font-size:1.25rem;margin:.2rem 0 .6rem}.hint{color:var(--g);font-size:.85rem}
.bar{height:8px;background:var(--pl);border-radius:8px;overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--o)}
input[type=text]{width:100%;max-width:360px;padding:11px 14px;border:2px solid var(--pl);border-radius:10px;font:1rem Poppins,sans-serif}
.q{font-weight:600;margin:0 0 10px;font-size:1.02rem}.meta{font-size:.8rem;color:var(--g);margin-bottom:6px}.tag{display:inline-block;background:var(--pl);color:var(--pd);border-radius:12px;padding:1px 10px;font-size:.75rem;margin-left:6px}
pre{background:var(--pd);color:#F5D9B8;padding:14px 16px;border-radius:10px;overflow-x:auto;font:.88rem/1.5 Consolas,"Courier New",monospace;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;margin:0 0 9px;padding:12px 14px;border:2px solid var(--pl);border-radius:10px;background:#fff;font:.92rem Poppins,sans-serif;cursor:pointer;color:var(--t)}
.opt:hover{border-color:var(--p)}.opt.sel{border-color:var(--p);background:var(--pl);font-weight:600}
.btn{border:0;background:var(--o);color:#fff;font:600 .9rem Poppins,sans-serif;padding:10px 20px;border-radius:8px;cursor:pointer}.btn.alt{background:var(--pl);color:var(--pd)}.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.big{font-size:2.6rem;font-weight:700;color:var(--p);line-height:1.1}
.pass{color:var(--ok)}.fail{color:var(--bad)}.br{display:grid;grid-template-columns:90px 1fr 56px;gap:8px;align-items:center;margin:6px 0;font-size:.85rem}
.br i{display:block;height:10px;border-radius:6px;background:var(--p)}.br div{background:var(--pl);border-radius:6px}.br.weak i{background:var(--bad)}
.rv{border-left:5px solid var(--bad);background:#FDF3F2;padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:.9rem}.rv b{color:var(--pd)}
label{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.9rem}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
</style></head><body>

<main><div class="wrap" id="v"></div></main>
<script>
const PASS=70,MINS=25;
// [hour, type (s=one answer, m=select all), question, code, options, correct indexes, explanation]
const Q=[
[1,"s","A clinic wants a system that learns from past patient no-shows to predict who will miss tomorrow's appointment. This is best described as:",0,["Machine Learning","A fixed list of hand-written rules","A spreadsheet formula","Plain data storage"],[0],"The system learns a pattern from historical data, which is Machine Learning."],
[1,"m","Select ALL steps that belong in the Data Science & AI workflow:",0,["Cleaning the data","Evaluating the model","Collecting data","Deleting the raw data before exploring it","Hiding results that look bad"],[0,1,2],"Collect, clean, explore, model, evaluate, deploy. Raw data is kept and honest results are reported."],
[2,"s","You type a note in a Jupyter cell and pressing Shift + Enter shows a SyntaxError. The most likely cause is:",0,["The cell type is Code, not Markdown","Anaconda is not installed","The kernel is idle","The notebook was saved"],[0],"Notes belong in Markdown cells. A Code cell tries to run them as Python."],
[3,"s","What does this print?",'prices = [1200, 800, 1500]\ndef total(items):\n    return sum(items)\nprint(total(prices) / len(prices))',["1166.6666666666667","3500","1166","1167"],[0],"3500 divided by 3. The / operator always gives a decimal."],
[3,"s","This code raises a NameError. What is the fix?",'student = {"name": "Tolu", "score": 78}\nprint(student[name])',['Put the key in quotes: student["name"]',"Use student.name","Use student(0)","Use student[0]"],[0],"Without quotes, Python looks for a variable called name. Dictionary keys here are strings."],
[3,"s","What does this print?",'rows = [{"id": 1, "mark": 40}, {"id": 2, "mark": 75}, {"id": 3, "mark": 90}]\ndf = pd.DataFrame(rows)\nprint(df[df["mark"] >= 50]["id"].tolist())',["[2, 3]","[1, 2, 3]","[75, 90]","[3]"],[0],"The list of dictionaries becomes a table. Rows with mark of 50 or more have ids 2 and 3."],
[4,"m","Select ALL statements that are true about Pandas:",0,["A DataFrame is made of Series (its columns)","pd.read_csv() returns a DataFrame","A Series can have custom labels as its index","A DataFrame can only hold numbers"],[0,1,2],"DataFrames can hold text, numbers, dates and more."],
[4,"s","What does this print?",'fares = pd.Series([1500, 2000, 2500, 3000], index=["Mon", "Tue", "Wed", "Thu"])\nprint(fares["Wed"] + fares["Thu"])',["5500","2500","3000","Error"],[0],"Labels select the values 2500 and 3000, which add to 5500."],
[5,"s","What does this print?",'trips = pd.DataFrame({"driver": ["A", "B"], "km": [12, 30]})\ntrips["km_x2"] = trips["km"] * 2\nprint(trips.shape)',["(2, 3)","(2, 2)","(3, 2)","(3, 3)"],[0],"Two rows, and now three columns after adding km_x2."],
[5,"s","The programmer expected ['a'] but sees ['a', 'b']. Why?",'df = pd.DataFrame({"a": [1, 2], "b": [3, 4]})\ndf.drop(columns=["b"])\nprint(df.columns.tolist())',["drop() returns a new DataFrame and the result was not assigned back","drop() only works on rows","Columns must be removed with del","print() restores deleted columns"],[0],"Write df = df.drop(columns=[\"b\"]) to keep the change."],
[6,"s","What does this print?",'clinic = pd.DataFrame({"patient": ["P1", "P2", "P3", "P4"]}, index=[10, 11, 12, 13])\nprint(clinic.iloc[1]["patient"], clinic.loc[11]["patient"])',["P2 P2","P2 P3","P1 P2","P2 P1"],[0],"iloc[1] is the second row by position. loc[11] is the row labelled 11. Both are P2."],
[6,"s","Which line returns exactly 3 rows from a DataFrame with the default index?",0,["df.loc[2:4]","df.iloc[2:4]","df.loc[2:3]","df.iloc[2:3]"],[0],"loc includes the end label (2, 3, 4). iloc excludes the end position."],
[6,"m","Select ALL statements that are true about identifiers and keys:",0,["No two rows share the same unique identifier","A primary key identifies a row in its own table","A foreign key refers to a primary key in another table","A first name is always a safe unique identifier"],[0,1,2],"Two people can share a first name, so it is not a safe identifier."],
[7,"s","What does this print?",'farm = pd.DataFrame({"crop": ["yam", "rice", "yam", "maize"], "tonnes": [8, 5, 12, 7]})\nprint(farm[(farm["crop"] == "yam") & (farm["tonnes"] > 10)].shape[0])',["1","2","3","0"],[0],"Only the second yam row has more than 10 tonnes."],
[7,"s","This line raises an error. Why?",'df[df["price"] > 100 and df["stock"] < 5]',["Python's and cannot combine Pandas conditions; use & with parentheses","price cannot be compared with 100","stock must be sorted first","A DataFrame cannot be filtered"],[0],'Write df[(df["price"] > 100) & (df["stock"] < 5)].'],
[7,"s","A shop wants its products listed from most to least expensive. Which line does that?",0,['products.sort_values("price", ascending=False)','products.sort_values("price")','products.sort("price", reverse=True)','products.order_by("price")'],[0],"sort_values with ascending=False sorts high to low."],
[7,"m","Select ALL lines that return rows where city is Lagos OR Abuja:",0,['df[df["city"].isin(["Lagos", "Abuja"])]','df[(df["city"] == "Lagos") | (df["city"] == "Abuja")]','df[~df["city"].isin(["Lagos", "Abuja"])]','df[df["city"] == "Lagos" & df["city"] == "Abuja"]'],[0,1],"isin and | both work. ~ means NOT, and the last line mixes & with missing parentheses."],
[8,"s","What does this print?",'d = {"course": ["Python", "SQL"], "seats": [30, 25]}\ndf = pd.DataFrame(d)\nprint(df.to_dict(orient="records")[1]["seats"])',["25","30","SQL","{'course': 'SQL', 'seats': 25}"],[0],"The records list holds one dictionary per row. Index 1 is the SQL row."],
[8,"s","A saved CSV has an unwanted extra first column of numbers 0, 1, 2... Which change prevents it?",0,['Save with df.to_csv("f.csv", index=False)','Read with pd.read_csv("f.csv", header=False)','Call df.to_dict() first','Rename the file to .xlsx'],[0],"index=False stops Pandas writing its row numbers."],
[8,"s","Which sequence is the most sensible for a small analysis?",0,["Load the CSV, filter the rows needed, sort them, save the result","Save the result, filter the rows, load the CSV, sort them","Sort the rows, save the result, load the CSV, filter them","Filter the rows, save the result, sort them, load the CSV"],[0],"You must load data before you can filter, sort or save it."]
];
const $=s=>document.querySelector(s),sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function el(t,a,...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{}))x==='class'?e.className=v:x.startsWith('on')?e.addEventListener(x.slice(2),v):e.setAttribute(x,v);k.flat().forEach(c=>e.append(c));return e}
let items,ans,i,name,timer,left,t0;
function start(){const v=$('#v'),n=el('input',{type:'text',placeholder:'Your full name','aria-label':'Your full name'}),cb=el('input',{type:'checkbox'});cb.checked=true;
 v.replaceChildren(el('h2',null,'Show what you can do'),el('p',null,Q.length+' scenario questions on Hours 1 to 8: reading code, finding bugs and choosing the right approach. Pass mark '+PASS+'%.'),
 el('p',{class:'hint'},'One attempt. No hints, no notes. Some questions ask you to select all correct answers. This works for any student who has completed Hours 1 to 8.'),n,el('label',null,cb,'Use the '+MINS+'-minute timer'),el('button',{class:'btn',onclick:()=>{name=n.value.trim()||'Student';begin(cb.checked)}},'Begin assessment'))}
function begin(useTimer){items=sh(Q).map(q=>({h:q[0],m:q[1]==='m',q:q[2],c:q[3],o:sh(q[4].map((t,k)=>({t,c:q[5].includes(k)}))),e:q[6]}));ans=items.map(()=>[]);i=0;t0=Date.now();clearInterval(timer);
 const tm=$('#tm');if(useTimer){left=MINS*60;tm.hidden=false;const tick=()=>{tm.textContent=String(left/60|0).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left--<=0){clearInterval(timer);finish()}};tick();timer=setInterval(tick,1000)}else tm.hidden=true;show()}
function pick(k){const a=ans[i];if(items[i].m){const x=a.indexOf(k);x<0?a.push(k):a.splice(x,1)}else ans[i]=[k];show()}
function show(){const it=items[i],v=$('#v');
 v.replaceChildren(el('div',{class:'meta'},'Question '+(i+1)+' of '+items.length,...(it.m?[el('span',{class:'tag'},'Select all that apply')]:[])),el('div',{class:'bar'},el('i',{style:'width:'+(i+1)/items.length*100+'%'})),el('p',{class:'q'},it.q),...(it.c?[el('pre',null,it.c)]:[]),
 ...it.o.map((o,k)=>el('button',{class:'opt'+(ans[i].includes(k)?' sel':''),'aria-pressed':ans[i].includes(k),onclick:()=>pick(k)},o.t)),
